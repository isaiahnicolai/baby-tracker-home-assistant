dismiss_alert:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            - domain: binary_sensor
              integration: baby_tracker
    baby_name:
      required: false
      selector:
        text:
    alert_type:
      required: false
      selector:
        select:
          options:
            - "feeding_overdue"
            - "no_poop"
            - "low_wet_diapers"
            - "fever"
            - "long_sleep"
            - "intake_low"
            - "feed_due"
            - "wake_to_feed"

