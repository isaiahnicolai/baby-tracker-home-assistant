# Services for Baby Tracker integration. Names and descriptions are in strings.json.
# Every service that adds a record takes an optional "time" to date it at; without it, now.

add_diaper:
  fields:
    baby_name:
      required: false
      selector:
        text:
    device_id:
      required: false
      selector:
        device:
          filter:
            - integration: baby_tracker
    pee:
      required: false
      selector:
        boolean:
    poo:
      required: false
      selector:
        boolean:
    note:
      required: false
      example: "Unusually soiled"
      selector:
        text:
    time:
      required: false
      selector:
        datetime:

add_nursing:
  fields:
    baby_name:
      required: false
      selector:
        text:
    device_id:
      required: false
      selector:
        device:
          filter:
            - integration: baby_tracker
    left_duration:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    right_duration:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    both_duration:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    finish_side:
      required: false
      default: "Left"
      selector:
        select:
          options:
            - "Left"
            - "Right"
            - "Both"
    note:
      required: false
      selector:
        text:
    time:
      required: false
      selector:
        datetime:

