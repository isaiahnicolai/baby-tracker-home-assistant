[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "babytracker-client"
version = "1.0.1"
license = "MIT"
license-files = ["LICENSE"]
description = "Python client and CLI for the Baby Tracker sync service (also used by the Home Assistant integration)"
readme = "custom_components/baby_tracker/client/README.md"
requires-python = ">=3.11"
keywords = ["baby tracker", "baby", "newborn", "sync", "home assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
]
dependencies = [
    "requests>=2.28",
    "python-dateutil>=2.8",
    "cmd2>=4",  # the interactive shell (babytracker with no command)
]

[project.optional-dependencies]
# Adding photos to entries (add_joy, attach_photo); Home Assistant ships Pillow already
photos = ["Pillow>=10"]

[project.urls]
Homepage = "https://github.com/isaiahnicolai/baby-tracker-home-assistant"
Documentation = "https://github.com/isaiahnicolai/baby-tracker-home-assistant/blob/main/custom_components/baby_tracker/client/README.md"
Changelog = "https://github.com/isaiahnicolai/baby-tracker-home-assistant/blob/main/CHANGELOG.md"
Issues = "https://github.com/isaiahnicolai/baby-tracker-home-assistant/issues"

[project.scripts]
babytracker = "babytracker_client.cli:main"

[tool.setuptools]
# The client lives inside the Home Assistant integration so a HACS install is
# self-contained; this publishes that same folder as a standalone package
# without importing the integration (which needs Home Assistant).
packages = ["babytracker_client"]
package-dir = { "babytracker_client" = "custom_components/baby_tracker/client" }

[tool.setuptools.package-data]
babytracker_client = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
