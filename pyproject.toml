[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "babytracker-client"
version = "0.3.1"
license = "MIT"
license-files = ["LICENSE"]
description = "Python client and CLI for the Baby Tracker sync service (also used by the Home Assistant integration)"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "python-dateutil>=2.8",
]

[project.scripts]
babytracker = "babytracker_client.cli:main"

[tool.setuptools]
# The client lives inside the Home Assistant integration so a HACS install is
# self-contained; this publishes that same folder as a standalone package
# without importing the integration (which needs Home Assistant).
packages = ["babytracker_client"]
package-dir = { "babytracker_client" = "custom_components/baby_tracker/client" }

[tool.setuptools.package-data]
babytracker_client = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
