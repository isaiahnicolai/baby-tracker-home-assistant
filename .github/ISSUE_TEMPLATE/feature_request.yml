name: Feature request
description: Something the app can do that you'd like in Home Assistant, or another idea
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this hasn't been asked for already
          required: true
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do, and how you'd use it (a dashboard, an automation, voice...).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Sensors and other entities
        - Buttons and logging records
        - Services
        - Voice / Assist
        - Blueprints
        - Python library or command line
        - Other
  - type: textarea
    id: app
    attributes:
      label: How the app does it, if it does
      description: Where it is in the Baby Tracker app, and on Android or iPhone.
  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: Any workaround you use now, such as a template sensor or an automation.
