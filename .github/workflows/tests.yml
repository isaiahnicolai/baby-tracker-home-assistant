name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client (no Home Assistant)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest tzdata
      - run: pytest tests --ignore=tests/ha -q

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same Python as the Home Assistant release pinned in requirements_test.txt
          python-version: "3.14"
      - run: pip install -r requirements_test.txt -e .
      - run: scripts/test -q
