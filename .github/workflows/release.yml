name: Release

# On a published GitHub release: attach the integration as baby_tracker.zip
# (hacs.json sets zip_release, so HACS downloads it instead of the source) and
# the babytracker-client wheel and sdist, so the library can be installed
# with pip straight from the release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/baby_tracker/manifest.json'))['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match manifest.json version $version" >&2
            exit 1
          fi

      - name: Zip the integration
        run: |
          cd custom_components/baby_tracker
          zip -r ../../baby_tracker.zip . -x "__pycache__/*" "*/__pycache__/*" "*.pyc"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the client package
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            baby_tracker.zip
            dist/*
