name: Newest Home Assistant

# The pull request tests pin one Home Assistant release (requirements_test.txt). This runs the
# integration tests against the newest release every week, so a change in Home Assistant that
# breaks the integration shows up before users update. GitHub emails the repository owner when
# a scheduled run fails.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  newest:
    name: Integration tests on the newest Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the newest test harness (it pins the newest Home Assistant)
        run: pip install --upgrade -e . pytest tzdata PyTurboJPEG pytest-homeassistant-custom-component
      - name: Show the versions under test
        run: pip show homeassistant pytest-homeassistant-custom-component | grep -E '^(Name|Version)'
      - run: python -m pytest tests/ha -q
