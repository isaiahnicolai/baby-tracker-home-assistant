blueprint:
  name: Baby Tracker - Feed due notification
  description: >
    Sends a notification to a phone running the Home Assistant app when a
    baby's Feed Due alert turns on (the predicted time of the next feed has
    passed). Use {baby} in the message for the baby's name.
  domain: automation
  source_url: https://github.com/isaiahnicolai/baby-tracker-home-assistant/blob/main/blueprints/automation/baby_tracker/feed_due_notification.yaml
  author: Baby Tracker for Home Assistant
  input:
    feed_due_alert:
      name: Feed Due alert
      description: The baby's Feed Due binary sensor (for example binary_sensor.ava_feed_due).
      selector:
        entity:
          filter:
            - integration: baby_tracker
              domain: binary_sensor
    notify_device:
      name: Phone to notify
      description: A device with the Home Assistant companion app.
      selector:
        device:
          filter:
            - integration: mobile_app
    title:
      name: Title
      default: Feed due
      selector:
        text:
    message:
      name: Message
      description: "{baby} is replaced with the baby's name."
      default: "{baby} is due for a feed"
      selector:
        text:

mode: single
max_exceeded: silent

variables:
  alert: !input feed_due_alert
  message_template: !input message

triggers:
  - trigger: state
    entity_id: !input feed_due_alert
    to: "on"

actions:
  - alias: Tell the phone which baby is due
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: !input title
    message: >
      {% set baby = state_attr(alert, 'baby_name') or state_attr(alert, 'friendly_name') %}
      {{ message_template | replace('{baby}', baby) }}
